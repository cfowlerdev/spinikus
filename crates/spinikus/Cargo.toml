[package]
name = "spinikus"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = {version = "4.6.7", features = ["derive", "env"]}
config = "0.15.27"
jiff.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber.workspace = true

spinikus-agent.workspace = true
spinikus-api.workspace = true
spinikus-control.workspace = true
spinikus-core.workspace = true
spinikus-store.workspace = true
spinikus-web.workspace = true

# Raw mode and the window's size for `shell`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# musl's allocator is slow under many threads; release binaries are built for musl.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
anyhow.workspace = true
hmac.workspace = true
sha2.workspace = true
async-trait.workspace = true
spinikus-agent = { workspace = true, features = ["test-support"] }
spinikus-proto.workspace = true
prost-types.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-stream.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
