data_dir = "data"

[logging]
level = "debug"
json = false

[http]
# Where the API and web UI listen. 127.0.0.1 is this machine only.
listen = "127.0.0.1:8080"

[agents]
# Where agents connect, over mutual TLS. Every call but enrollment needs a client
# certificate from the internal CA, and enrollment needs a join token.
listen = "0.0.0.0:8443"

[database]
# path = "spinikus.db"   # relative paths resolve against data_dir

[secrets]
# Master encryption key, kept outside the database. Without either setting it is
# <data_dir>/master.key, generated on first start.
# master_key_file = "/etc/spinikus/master.key"   # relative paths resolve against data_dir
# Or set SPINIKUS_SECRETS__MASTER_KEY to a base64 key (openssl rand -base64 32).

[proxy]
# Where the agent on this machine serves apps over plain HTTP. Defaults to 0.0.0.0:80;
# in development a high loopback port needs no privileges. Generated hostnames such as
# http://web-production-shop.localhost:8000 resolve to this machine without DNS.
listen = "127.0.0.1:8000"
# Where it serves HTTPS, with certificates from the ACME CA once the acme_email setting
# is set. Defaults to 0.0.0.0:443.
https_listen = "127.0.0.1:8444"
# enabled = false   # run the agent without a proxy
