# Formatting, lints, the stylesheet, the guide's links and the tests on every push and pull
# request. Tests that need Docker are #[ignore]d and don't run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask css --check
      - run: cargo xtask guide
      - run: cargo test --workspace --locked
