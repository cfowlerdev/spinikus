[workspace]
resolver = "2"
members = [
    "crates/*"
]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["zeroize"] }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bollard = "0.21.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
gethostname = "1.1.0"
http-body-util = "0.1.5"
jiff = { version = "0.2.38", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rpassword = "7.5.4"
serde = {version = "1.0.229", features=["derive"]}
serde_json = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
time = { version = "0.3.55", default-features = false }
tokio = {version = "1.54.1", features = ["full"]}
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
ulid = "3.0.0"
x509-parser = "0.18.1"
zeroize = "1.9.1"

spinikus-agent = { path = "crates/spinikus-agent" }
spinikus-api = { path = "crates/spinikus-api" }
spinikus-control = { path = "crates/spinikus-control" }
spinikus-core = { path = "crates/spinikus-core" }
spinikus-proto = { path = "crates/spinikus-proto" }
spinikus-proxy = { path = "crates/spinikus-proxy" }
spinikus-store = { path = "crates/spinikus-store" }
spinikus-web = { path = "crates/spinikus-web" }

# Password hashing is deliberately slow; unoptimized, sign-ins and tests take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
